<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient (Holy Ganga River at Dawn) -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#180B04" />
      <stop offset="35%" stop-color="#4A1807" />
      <stop offset="65%" stop-color="#9B3D12" />
      <stop offset="85%" stop-color="#F28C28" />
      <stop offset="100%" stop-color="#FFD700" />
    </linearGradient>

    <linearGradient id="riverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F28C28" />
      <stop offset="25%" stop-color="#8C330C" />
      <stop offset="60%" stop-color="#3A1405" />
      <stop offset="100%" stop-color="#1A0A03" />
    </linearGradient>

    <!-- Sun Glow -->
    <radialGradient id="sunAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#FFF5A0" />
      <stop offset="60%" stop-color="#FFD700" />
      <stop offset="85%" stop-color="#F28C28" />
      <stop offset="100%" stop-color="#F28C28" stop-opacity="0" />
    </radialGradient>

    <!-- Diya Gold -->
    <radialGradient id="diyaGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#FFF275" />
      <stop offset="60%" stop-color="#FF9900" />
      <stop offset="100%" stop-color="#D83010" />
    </radialGradient>

    <linearGradient id="soopGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE57F" />
      <stop offset="50%" stop-color="#E5A630" />
      <stop offset="100%" stop-color="#8C530C" />
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Sky Layer -->
  <rect x="0" y="0" width="1200" height="380" fill="url(#skyGrad)" />

  <!-- Sacred Sun Rays (Mandala) -->
  <g opacity="0.45" stroke="#FFD700" stroke-width="3" stroke-linecap="round">
    <line x1="600" y1="210" x2="600" y2="40" />
    <line x1="600" y1="210" x2="430" y2="90" />
    <line x1="600" y1="210" x2="770" y2="90" />
    <line x1="600" y1="210" x2="320" y2="160" />
    <line x1="600" y1="210" x2="880" y2="160" />
    <line x1="600" y1="210" x2="250" y2="250" />
    <line x1="600" y1="210" x2="950" y2="250" />
  </g>

  <!-- Giant Golden Sun (Surya Dev) -->
  <circle cx="600" cy="220" r="160" fill="url(#sunAura)" filter="url(#glow)" />
  <circle cx="600" cy="220" r="85" fill="#FFFDF0" />

  <!-- River Water Surface -->
  <rect x="0" y="360" width="1200" height="270" fill="url(#riverGrad)" />

  <!-- Water Sun Reflection -->
  <ellipse cx="600" cy="420" rx="140" ry="25" fill="#FFD700" opacity="0.6" filter="url(#glow)" />
  <ellipse cx="600" cy="460" rx="110" ry="18" fill="#F28C28" opacity="0.7" />
  <ellipse cx="600" cy="510" rx="70" ry="12" fill="#FFD700" opacity="0.5" />

  <!-- River Waves Pattern -->
  <path d="M 0 380 Q 300 370, 600 380 T 1200 380 L 1200 630 L 0 630 Z" fill="none" stroke="#FFD700" stroke-width="1.5" opacity="0.3" />
  <path d="M 0 420 Q 300 410, 600 420 T 1200 420" fill="none" stroke="#FFD700" stroke-width="1.5" opacity="0.25" />
  <path d="M 0 470 Q 300 460, 600 470 T 1200 470" fill="none" stroke="#FFD700" stroke-width="1.5" opacity="0.2" />

  <!-- Sacred Bamboo Soop (Arghya Vessel) Center Bottom -->
  <g transform="translate(600, 480)">
    <!-- Woven Soop Base -->
    <path d="M -130 -30 L -100 70 Q 0 95, 100 70 L 130 -30 Q 0 0, -130 -30 Z" fill="url(#soopGold)" stroke="#FFF5E1" stroke-width="3" />
    
    <!-- Red Auspicious Sindoor Tilak -->
    <ellipse cx="0" cy="25" rx="18" ry="12" fill="#D32F2F" />

    <!-- Sacred Offering Diya -->
    <ellipse cx="0" cy="5" rx="35" ry="15" fill="#5C1E06" stroke="#FFD700" stroke-width="2" />
    
    <!-- Divine Diya Flame -->
    <path d="M 0 -55 C -18 -25, -15 -10, 0 10 C 15 -10, 18 -25, 0 -55 Z" fill="url(#diyaGlow)" filter="url(#glow)" />
    <ellipse cx="0" cy="-5" rx="6" ry="12" fill="#FFFFFF" />
  </g>

  <!-- Left Floating Diya -->
  <g transform="translate(240, 460)">
    <ellipse cx="0" cy="15" rx="28" ry="10" fill="#5C1E06" stroke="#FFD700" stroke-width="1.5" />
    <path d="M 0 -25 C -12 -5, -10 5, 0 18 C 10 5, 12 -5, 0 -25 Z" fill="url(#diyaGlow)" />
  </g>

  <!-- Right Floating Diya -->
  <g transform="translate(960, 460)">
    <ellipse cx="0" cy="15" rx="28" ry="10" fill="#5C1E06" stroke="#FFD700" stroke-width="1.5" />
    <path d="M 0 -25 C -12 -5, -10 5, 0 18 C 10 5, 12 -5, 0 -25 Z" fill="url(#diyaGlow)" />
  </g>

  <!-- Top Title Banner / Typography -->
  <g text-anchor="middle">
    <!-- Devanagari Main Heading -->
    <text x="600" y="85" font-family="'Cinzel', 'Yatra One', 'Rozha One', serif" font-size="44" font-weight="bold" fill="#FFD700" filter="url(#glow)" letter-spacing="4">
      ॥ लोक आस्था का महापर्व छठ ॥
    </text>

    <!-- Subtitle Badge -->
    <rect x="360" y="115" width="480" height="38" rx="19" fill="#180B04" fill-opacity="0.8" stroke="#F28C28" stroke-width="1.5" />
    <text x="600" y="141" font-family="'Plus Jakarta Sans', sans-serif" font-size="19" font-weight="bold" fill="#FFF5E1" letter-spacing="2">
      CHHATH : THE PRIDE OF BIHAR
    </text>

    <!-- Bottom Tagline -->
    <rect x="250" y="580" width="700" height="36" rx="18" fill="#180B04" fill-opacity="0.9" stroke="#FFD700" stroke-width="1.2" />
    <text x="600" y="604" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="600" fill="#FFD700" letter-spacing="1">
      पावन घाट • अमर लोकगीत • सजीव अर्घ्य • chhathsong.in
    </text>
  </g>
</svg>
