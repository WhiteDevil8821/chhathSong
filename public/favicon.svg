<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Sacred Sun Gradient -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="60%" stop-color="#F28C28" />
      <stop offset="100%" stop-color="#9B3D12" />
    </radialGradient>
    <!-- Sacred Diya Flame Gradient -->
    <radialGradient id="flameGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFDF0" />
      <stop offset="35%" stop-color="#FFD700" />
      <stop offset="70%" stop-color="#F28C28" />
      <stop offset="100%" stop-color="#E34234" />
    </radialGradient>
    <linearGradient id="earthenPot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D96826" />
      <stop offset="100%" stop-color="#5C1E06" />
    </linearGradient>
  </defs>

  <!-- Dark Sacred Earthen Background Disc -->
  <circle cx="32" cy="32" r="30" fill="#2D1B0D" stroke="#F28C28" stroke-width="2.5" />

  <!-- 12 Radiating Sun Rays (Surya Mandala) -->
  <g stroke="#F28C28" stroke-width="2" stroke-linecap="round" opacity="0.85">
    <line x1="32" y1="6" x2="32" y2="11" />
    <line x1="32" y1="53" x2="32" y2="58" />
    <line x1="6" y1="32" x2="11" y2="32" />
    <line x1="53" y1="32" x2="58" y2="32" />
    <line x1="13.6" y1="13.6" x2="17.2" y2="17.2" />
    <line x1="46.8" y1="46.8" x2="50.4" y2="50.4" />
    <line x1="13.6" y1="50.4" x2="17.2" y2="46.8" />
    <line x1="46.8" y1="17.2" x2="50.4" y2="13.6" />
  </g>

  <!-- Golden Sun Core -->
  <circle cx="32" cy="30" r="18" fill="url(#sunGlow)" opacity="0.9" />

  <!-- Traditional Sacred Clay Diya Bowl -->
  <path d="M 17 38 C 17 48, 47 48, 47 38 C 47 36, 17 36, 17 38 Z" fill="url(#earthenPot)" stroke="#FFD700" stroke-width="1.2" />

  <!-- Sacred Diya Flame (Jyoti) -->
  <path d="M 32 14 C 27 24, 25 29, 32 37 C 39 29, 37 24, 32 14 Z" fill="url(#flameGlow)" />

  <!-- Flame Inner Bright Core -->
  <ellipse cx="32" cy="30" rx="3" ry="5" fill="#FFFFFF" opacity="0.9" />
</svg>
